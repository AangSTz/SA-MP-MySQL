name: Build SA-MP MySQL Plugin

on:
  push:
    branches: [ master ]
    tags: [ 'v*', 'R*' ]
  pull_request:
  workflow_dispatch:

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build-windows:
    name: Windows (x86, Release)
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -A Win32
          -DTARGET_ARCH=x86
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist"

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: cmake --install build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mysql-plugin-windows-x86
          path: dist/

  build-linux:
    name: Linux (x86 / 32-bit, Release)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-multilib g++-multilib make

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DTARGET_ARCH=x86
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Install
        run: cmake --install build

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mysql-plugin-linux-x86
          path: dist/

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build-windows, build-linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Zip artifacts
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done

      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: artifacts/*.zip
